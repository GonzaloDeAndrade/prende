<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de clips</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #161922; --panel-2: #1d212c; --border: #2a2e3a;
    --text: #eceef2; --muted: #8b90a0; --accent: #6c8cff; --accent-soft: rgba(108,140,255,0.15);
    --good: #3ecf8e; --good-soft: rgba(62,207,142,0.15); --bad: #ff6b6b; --bad-soft: rgba(255,107,107,0.13);
    --warn: #f5a623; --radius: 16px; --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 20% -10%, #1a2036 0%, var(--bg) 45%);
    color: var(--text); font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    margin: 0; min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,13,18,0.9); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
  }
  .header-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; }

  select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 14px; font-size: 13.5px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, opacity 0.15s, transform 0.1s;
    font-family: inherit;
  }
  select { min-width: 200px; }
  select:hover, button:hover:not(:disabled) { border-color: #3d4256; }
  button.primary { background: var(--accent); border: none; font-weight: 600; color: #0b0d12; }
  button.primary:hover:not(:disabled) { background: #7f9bff; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:active:not(:disabled) { transform: scale(0.97); }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover:not(:disabled) { background: var(--panel-2); }

  .mode-switch {
    display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px;
  }
  .mode-switch button {
    border: none; background: transparent; border-radius: 999px; padding: 7px 13px;
    font-size: 12.5px; color: var(--muted); font-weight: 600;
  }
  .mode-switch button.active { background: var(--accent); color: #0b0d12; }
  .mode-switch button:hover:not(.active) { background: var(--panel-2); color: var(--text); }

  .view-tabs { display: flex; gap: 4px; margin-left: auto; }
  .view-tabs button { padding: 8px 14px; font-size: 12.5px; }
  .view-tabs button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; display: none; flex-shrink: 0; }
  .spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar { flex: 1; max-width: 240px; height: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: none; }
  .progress-bar.active { display: block; }
  .progress-bar > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; }

  main { padding: 28px 20px 70px; max-width: 1400px; margin: 0 auto; }
  .empty { color: var(--muted); padding: 100px 20px; text-align: center; font-size: 14px; }
  .empty .spinner { display: inline-block; width: 15px; height: 15px; margin-right: 8px; vertical-align: -2px; }

  /* ---------- DECK VIEW ---------- */
  .deck { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .deck-counter { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; }
  .deck-stage { display: flex; align-items: center; gap: 14px; width: 100%; justify-content: center; }
  .nav-arrow {
    width: 44px; height: 44px; border-radius: 50%; font-size: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .deck-card {
    width: min(360px, 88vw); background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .deck-card.done { border-color: var(--good); }
  .deck-video-frame {
    width: 100%; aspect-ratio: 9/16; border-radius: 12px; background: #000;
    overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
  }
  .deck-video-frame video { width: 100%; height: 100%; object-fit: contain; }
  .top-pick {
    position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; background: rgba(245,166,35,0.9); color: #1a1200; z-index: 2;
  }
  .final-badge {
    position: absolute; top: 10px; right: 10px; background: var(--good); color: #06120c;
    font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; z-index: 2;
  }
  .preview-pending { font-size: 12.5px; color: var(--muted); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }

  .deck-title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .deck-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--panel-2); border-radius: 5px; padding: 2px 8px; }
  .deck-verdict { font-size: 12.5px; color: var(--muted); font-style: italic; line-height: 1.4; }

  .trim-panel { background: var(--panel-2); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .trim-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .trim-label { font-size: 11.5px; color: var(--muted); font-weight: 600; width: 46px; }
  .trim-group { display: flex; align-items: center; gap: 2px; }
  .trim-btn {
    width: 30px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font-size: 12px; padding: 0; display: flex; align-items: center; justify-content: center;
  }
  .trim-btn:hover:not(:disabled) { background: var(--border); }

  .deck-actions { display: flex; gap: 10px; }
  .deck-actions button { flex: 1; padding: 13px; font-size: 14px; font-weight: 700; border-radius: 12px; }
  .btn-discard { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
  .btn-discard:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  .btn-use { background: var(--good); border: none; color: #06120c; }
  .btn-use:hover:not(:disabled) { background: #55e6a5; }

  .deck-empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .deck-empty .big { font-size: 34px; margin-bottom: 8px; }

  /* ---------- GRID VIEW ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 9px; transition: border-color 0.2s; }
  .card:hover { border-color: #3a3f52; }
  .card.done { border-color: var(--good); }
  .card-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
  .card-title { font-weight: 650; font-size: 14px; line-height: 1.3; }
  .video-frame { width: 100%; aspect-ratio: 9/16; max-height: 380px; border-radius: 10px; background: #000; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
  .video-frame video { width: 100%; height: 100%; object-fit: contain; }
  .card button { width: 100%; padding: 10px; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand"><span class="dot"></span><h1>Revisión de clips</h1></div>
    <select id="videoSelect"></select>
    <select id="categorySelect" title="Ajusta el criterio de selección al tipo de contenido">
      <option value="general">🎙 Entrevista / Podcast</option>
      <option value="streaming">🎮 Streaming / Gaming / IRL</option>
      <option value="educativo">🎓 Educativo / Tutorial</option>
      <option value="comedia">😂 Comedia / Sketch</option>
      <option value="motivacion">✨ Motivación / Storytelling</option>
      <option value="opinion">🗣 Opinión / Debate / Noticias</option>
    </select>
    <div class="mode-switch">
      <button id="modeAudio" class="active">🎧 Solo audio</button>
      <button id="modeVisual">🎬 Audio + imagen</button>
    </div>
    <button id="analyzeBtn" class="primary">Analizar</button>
    <button id="reanalyzeBtn" class="secondary">Re-analizar</button>
    <div class="view-tabs">
      <button id="tabDeck" class="active">Revisar</button>
      <button id="tabGrid">Ver todos</button>
    </div>
  </div>
  <div class="status-row">
    <span class="spinner" id="statusSpinner"></span>
    <span id="status"></span>
    <div class="progress-bar" id="progressBar"><div id="progressFill" style="width:0%"></div></div>
  </div>
</header>
<main>
  <div id="content" class="empty">Elegí un video y apretá Analizar.</div>
</main>

<script>
const videoSelect = document.getElementById('videoSelect');
const categorySelect = document.getElementById('categorySelect');
const analyzeBtn = document.getElementById('analyzeBtn');
const reanalyzeBtn = document.getElementById('reanalyzeBtn');
const modeAudio = document.getElementById('modeAudio');
const modeVisual = document.getElementById('modeVisual');
const tabDeck = document.getElementById('tabDeck');
const tabGrid = document.getElementById('tabGrid');
const statusEl = document.getElementById('status');
const statusSpinner = document.getElementById('statusSpinner');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const content = document.getElementById('content');

let useVisual = false;
let viewMode = 'deck';
let polling = null;
let clips = [];
let deckPos = 0;
let currentVideoStem = null;
let currentCategory = null;

modeAudio.onclick = () => { useVisual = false; modeAudio.classList.add('active'); modeVisual.classList.remove('active'); };
modeVisual.onclick = () => { useVisual = true; modeVisual.classList.add('active'); modeAudio.classList.remove('active'); };
tabDeck.onclick = () => { viewMode = 'deck'; tabDeck.classList.add('active'); tabGrid.classList.remove('active'); render(); };
tabGrid.onclick = () => { viewMode = 'grid'; tabGrid.classList.add('active'); tabDeck.classList.remove('active'); render(); };
categorySelect.onchange = () => { if (videoSelect.value) loadCandidates(videoSelect.value); };

function setBusy(busy, pct) {
  statusSpinner.classList.toggle('active', busy);
  if (typeof pct === 'number') {
    progressBar.classList.add('active');
    progressFill.style.width = pct + '%';
  } else {
    progressBar.classList.remove('active');
  }
}

async function loadVideos() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  videoSelect.innerHTML = videos.map(v =>
    `<option value="${v.stem}">${v.name}${v.has_candidates ? ' ✓' : ''}</option>`
  ).join('');
  const withCandidates = videos.find(v => v.has_candidates);
  if (withCandidates) {
    videoSelect.value = withCandidates.stem;
    loadCandidates(withCandidates.stem);
  }
}

function render() {
  if (!clips.length) return;
  if (viewMode === 'deck') renderDeck(); else renderGrid();
}

// Firma de lo que está VISIBLE ahora mismo (la card actual en deck, todas
// en grid) — para no reconstruir el DOM y cortar un video que se está
// reproduciendo cuando en realidad no cambió nada de lo que se ve.
function visibleSignature() {
  if (viewMode === 'deck') {
    const c = clips[deckPos];
    return c ? `${c.index}:${c.preview_url}:${c.rendered_url}` : 'none';
  }
  return clips.map(c => `${c.index}:${c.preview_url}:${c.rendered_url}`).join('|');
}

// ---------- DECK ----------
function renderDeck() {
  content.className = '';
  if (deckPos >= clips.length) deckPos = clips.length - 1;
  if (deckPos < 0) {
    content.innerHTML = `<div class="deck-empty"><div class="big">🎬</div>Ya revisaste todos los candidatos.<br><button class="secondary" style="margin-top:14px" onclick="deckPos=0;render()">Volver a mirarlos</button></div>`;
    return;
  }
  const c = clips[deckPos];
  const parts = c.parts.map(p => `${p[0].toFixed(1)}s–${p[1].toFixed(1)}s`).join(' + ');
  const isTop = clips.indexOf(c) < 2;

  content.innerHTML = `
    <div class="deck">
      <div class="deck-counter">${deckPos + 1} / ${clips.length}</div>
      <div class="deck-stage">
        <button class="secondary nav-arrow" id="prevBtn" ${deckPos === 0 ? 'disabled' : ''}>‹</button>
        <div class="deck-card ${c.rendered_url ? 'done' : ''}" data-index="${c.index}">
          <div class="deck-video-frame" id="deckFrame">
            ${isTop ? '<div class="top-pick">🔥 recomendado</div>' : ''}
            ${c.rendered_url ? '<div class="final-badge">✓ versión final</div>' : ''}
            ${videoInner(c)}
          </div>
          <div class="deck-title">${c.title}</div>
          <div class="deck-meta">
            ${c.hook_type ? `<span class="tag">${c.hook_type}</span>` : ''}
            <span class="tag" id="durTag">${c.duration}s</span>
          </div>
          ${c.verdict ? `<div class="deck-verdict">${c.verdict}</div>` : ''}
          <div class="trim-panel">
            <div class="trim-line">
              <span class="trim-label">Inicio</span>
              <div class="trim-group">
                <button class="trim-btn" data-field="start" data-delta="1" title="Empieza 1s más tarde">✂ Recortar</button>
                <button class="trim-btn" data-field="start" data-delta="-1" title="Empieza 1s más temprano">↔ Extender</button>
              </div>
            </div>
            <div class="trim-line">
              <span class="trim-label">Final</span>
              <div class="trim-group">
                <button class="trim-btn" data-field="end" data-delta="-1" title="Termina 1s antes">✂ Recortar</button>
                <button class="trim-btn" data-field="end" data-delta="1" title="Termina 1s después">↔ Extender</button>
              </div>
            </div>
          </div>
          <div class="deck-actions">
            <button class="btn-discard" id="discardBtn">✕ Descartar</button>
            <button class="btn-use" id="useBtn">${c.rendered_url ? '✓ Regenerar' : '✓ Usar este'}</button>
          </div>
        </div>
        <button class="secondary nav-arrow" id="nextBtn" ${deckPos === clips.length - 1 ? 'disabled' : ''}>›</button>
      </div>
    </div>
  `;

  document.getElementById('prevBtn').onclick = () => { deckPos--; render(); };
  document.getElementById('nextBtn').onclick = () => { deckPos++; render(); };
  document.getElementById('discardBtn').onclick = () => { deckPos++; render(); };
  document.getElementById('useBtn').onclick = async () => {
    const btn = document.getElementById('useBtn');
    const ok = await useCandidate(c, btn);
    if (ok) { render(); setTimeout(() => { deckPos++; render(); }, 600); }
  };

  content.querySelectorAll('.trim-btn').forEach(btn => {
    btn.onclick = () => adjustTrim(c, btn.dataset.field, parseFloat(btn.dataset.delta));
  });
}

function videoInner(c) {
  const src = c.rendered_url || c.preview_url;
  if (src) return `<video controls muted src="${src}"></video>`;
  return `<div class="preview-pending"><span class="spinner active"></span>generando vista previa...</div>`;
}

async function useCandidate(c, btn) {
  btn.disabled = true;
  btn.textContent = 'Generando...';
  const res = await fetch(`/api/render/${currentVideoStem}/${c.index}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ category: currentCategory }),
  });
  const data = await res.json();
  if (data.url) {
    c.rendered_url = data.url;
    return true;
  }
  btn.textContent = 'Error: ' + (data.error || '?');
  btn.disabled = false;
  return false;
}

async function adjustTrim(c, field, delta) {
  const body = field === 'start' ? { delta_start: delta } : { delta_end: delta };
  body.category = currentCategory;
  document.querySelectorAll('.trim-btn').forEach(b => b.disabled = true);
  const res = await fetch(`/api/adjust/${currentVideoStem}/${c.index}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json();
  document.querySelectorAll('.trim-btn').forEach(b => b.disabled = false);
  if (data.preview_url) {
    c.preview_url = data.preview_url;
    c.duration = data.duration;
    c.rendered_url = null; // quedó desactualizada, hay que regenerar
    const frame = document.getElementById('deckFrame');
    if (frame) {
      const badge = frame.querySelector('.final-badge');
      if (badge) badge.remove();
      const old = frame.querySelector('video, .preview-pending');
      if (old) old.outerHTML = `<video controls muted src="${c.preview_url}"></video>`;
    }
    const durTag = document.getElementById('durTag');
    if (durTag) durTag.textContent = `${c.duration}s`;
    const useBtn = document.getElementById('useBtn');
    if (useBtn) useBtn.textContent = '✓ Usar este';
  }
}

document.addEventListener('keydown', (e) => {
  if (viewMode !== 'deck' || !clips.length) return;
  if (e.key === 'ArrowRight' && deckPos < clips.length - 1) { deckPos++; render(); }
  if (e.key === 'ArrowLeft' && deckPos > 0) { deckPos--; render(); }
});

// ---------- GRID ----------
function renderGrid() {
  content.className = 'grid';
  content.innerHTML = clips.map((c, i) => `
    <div class="card ${c.rendered_url ? 'done' : ''}" data-index="${c.index}">
      <div class="card-top">
        <div class="card-title">${c.title}</div>
        ${i < 2 ? '<div class="top-pick" style="position:static">🔥</div>' : ''}
      </div>
      <div class="deck-meta">
        ${c.hook_type ? `<span class="tag">${c.hook_type}</span>` : ''}
        <span class="tag">${c.duration}s</span>
      </div>
      <div class="video-frame">
        ${c.rendered_url ? '<div class="final-badge">✓ final</div>' : ''}
        ${videoInner(c)}
      </div>
      <button class="btn-use" data-index="${c.index}">${c.rendered_url ? '✓ Regenerar' : '✓ Usar este'}</button>
    </div>
  `).join('');
  content.querySelectorAll('.btn-use').forEach(btn => {
    const c = clips.find(x => x.index == btn.dataset.index);
    btn.onclick = async () => { await useCandidate(c, btn); renderGrid(); };
  });
}

// ---------- DATA LOADING ----------
async function loadCandidates(videoStem, opts = {}) {
  const silent = !!opts.silent;
  const category = categorySelect.value;
  const res = await fetch(`/api/candidates/${videoStem}?category=${category}`);
  if (!res.ok) { content.className = 'empty'; content.textContent = 'Todavía no se analizó este video con esta categoría.'; clips = []; return; }
  const data = await res.json();
  data.sort((a, b) => b.score - a.score);

  const isNewVideo = currentVideoStem !== videoStem || currentCategory !== category;
  currentVideoStem = videoStem;
  currentCategory = category;
  if (isNewVideo) deckPos = 0;

  const sigBefore = (silent && !isNewVideo) ? visibleSignature() : null;
  clips = data;
  const sigAfter = (silent && !isNewVideo) ? visibleSignature() : null;

  if (!silent || isNewVideo || sigBefore !== sigAfter) {
    render();
  }

  const pending = clips.some(c => !c.preview_url);
  setBusy(pending);
  if (pending) {
    const statusRes = await fetch(`/api/status/${videoStem}?category=${category}`);
    const statusData = await statusRes.json();
    if (!['transcribiendo', 'analizando (esto puede tardar)'].includes(statusData.status) &&
        !(statusData.status || '').startsWith('generando vistas previas')) {
      await fetch(`/api/generate_previews/${videoStem}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category }),
      });
      pollStatus(videoStem, category);
    } else {
      setTimeout(() => loadCandidates(videoStem, { silent: true }), 2500);
    }
  }
}

async function pollStatus(videoStem, category) {
  clearInterval(polling);
  setBusy(true);
  polling = setInterval(async () => {
    const res = await fetch(`/api/status/${videoStem}?category=${category}`);
    const data = await res.json();
    statusEl.textContent = data.status;
    const match = (data.status || '').match(/\((\d+)\/(\d+)\)/);
    if (match) setBusy(true, (parseInt(match[1]) / parseInt(match[2])) * 100);
    if ((data.status || '').startsWith('generando vistas previas')) {
      loadCandidates(videoStem, { silent: true });
    }
    if (data.status === 'listo') {
      clearInterval(polling);
      setBusy(false);
      analyzeBtn.disabled = false;
      reanalyzeBtn.disabled = false;
      loadCandidates(videoStem);
    } else if (data.status === 'error') {
      clearInterval(polling);
      setBusy(false);
      analyzeBtn.disabled = false;
      reanalyzeBtn.disabled = false;
      statusEl.textContent = 'Error: ' + data.error;
    }
  }, 2000);
}

async function startAnalysis(force) {
  const videoStem = videoSelect.value;
  const category = categorySelect.value;
  if (!videoStem) return;
  analyzeBtn.disabled = true;
  reanalyzeBtn.disabled = true;
  setBusy(true);
  content.className = 'empty';
  content.innerHTML = '<span class="spinner active"></span>Analizando...';
  await fetch(`/api/analyze/${videoStem}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ use_visual: useVisual, category, force }),
  });
  pollStatus(videoStem, category);
}

analyzeBtn.onclick = () => startAnalysis(false);
reanalyzeBtn.onclick = () => startAnalysis(true);
videoSelect.onchange = () => loadCandidates(videoSelect.value);

loadVideos();
</script>
</body>
</html>
